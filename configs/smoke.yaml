# Synthetic smoke test. Scores produced with this config are NOT research findings.
base: default.yaml
name: smoke
synthetic: true
data:
  processed_dir: artifacts/smoke/processed
artifacts_dir: artifacts/smoke
reports_dir: artifacts/smoke/reports
transfer:
  equipment: {min_rows: 50, exclude_largest: true}
  federation: {top_k: 2}
features:
  bodyweight_bins: [0, 60, 75, 90, 105, 120, 1000]
  federation_min_count: 5
models:
  lightgbm:
    n_estimators: 50
    early_stopping_rounds: 10
    grid:
      - {num_leaves: 7, min_child_samples: 10}
  mlp:
    max_epochs: 3
    patience: 2
    batch_size: 256
    seeds: [42]
  embed_mlp:
    max_epochs: 3
    patience: 2
    batch_size: 256
  catboost:
    iterations: 50
    od_wait: 10
    depth: 4
  seq_transformer:
    seq_len: 6
    max_epochs: 2
    patience: 1
    batch_size: 256
  resnet_mlp:
    max_epochs: 3
    patience: 2
    batch_size: 256
  gru:
    max_epochs: 2
    patience: 1
    batch_size: 256
hpo:
  seed: 0
  train_fraction: 1.0
  trials: {lightgbm: 2, embed_mlp: 1, gru: 1}
# Follow-up: extra seeds for the tuned models; predictions are averaged per model.
seedavg:
  extra_seeds: [43, 44]

evaluation:
  bootstrap_reps: 20
  sparse_rows: 20
  sparse_lifters: 5
