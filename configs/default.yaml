# Full-snapshot experiment configuration.
# All choices here were fixed before any test-partition metrics were computed.
name: full
seed: 42

data:
  source_url: https://openpowerlifting.gitlab.io/opl-csv/files/openpowerlifting-latest.zip
  raw_dir: data/raw
  processed_dir: data/processed
  # Fraction of lifters kept (sampled by hashed lifter identity, never by row). 1.0 = all.
  lifter_fraction: 1.0
  # Plausibility ranges; values outside are set to missing (rows are kept).
  age_range: [5, 100]
  bodyweight_range: [20, 300]

artifacts_dir: artifacts
reports_dir: reports

splits:
  group: {train: 0.70, val: 0.15, test: 0.15}
  # Chronological boundaries are chosen from row-date quantiles (coverage only),
  # snapped to the first day of the month.
  chrono_quantiles: {val_start: 0.70, test_start: 0.85}

transfer:
  # Selection rules fixed in advance, using cleaned row counts only.
  equipment:
    min_rows: 20000
    exclude_largest: true  # holding out the majority category leaves an unrepresentative train set
  federation:
    top_k: 3

features:
  # Bodyweight bins (kg) for subgroup analysis, fixed before evaluation.
  bodyweight_bins: [0, 60, 75, 90, 105, 120, 1000]
  federation_min_count: 500  # federations rarer than this (in train) map to the unknown code

models:
  ratio: {}
  linear:
    alphas: [0.0, 1.0, 10.0, 100.0]
  lightgbm:
    objective: regression          # L2; early stopping monitors validation L1
    learning_rate: 0.1
    n_estimators: 3000
    early_stopping_rounds: 50
    grid:
      - {num_leaves: 31, min_child_samples: 20}
      - {num_leaves: 127, min_child_samples: 20}
      - {num_leaves: 127, min_child_samples: 200}
      - {num_leaves: 255, min_child_samples: 100}
  mlp:
    hidden: [128, 64]
    dropout: 0.1
    lr: 0.001
    batch_size: 4096
    max_epochs: 40
    patience: 5
    loss: l1                       # matches the primary metric (MAE)
    device: auto                   # cuda if available, otherwise cpu
    seeds: [42, 43, 44]            # repeated seeds for the final (feature set D) MLP
  embed_mlp:                       # deep-learning architecture follow-up
    hidden: [256, 128]
    dropout: 0.1
    lr: 0.001
    batch_size: 4096
    max_epochs: 40
    patience: 5
    loss: l1
    n_frequencies: 16
    frequency_scale: 0.5             # std of initial periodic frequencies (standardized inputs)
    d_embedding: 16
    d_cat: 8
    device: auto
  catboost:                        # follow-up: CatBoost with native categoricals
    # MAE loss: CatBoost's Huber diverged (Newton leaf steps; zero curvature outside delta)
    # or learned far too slowly (gradient steps) on a 200k-row validation check.
    loss: mae
    boost_from_average: true
    learning_rate: 0.08
    depth: 8
    l2_leaf_reg: 3.0
    border_count: 254
    iterations: 6000
    od_wait: 100
  seq_transformer:                 # sequence follow-up: attention over past meets
    seq_len: 16
    d_model: 64
    n_heads: 4
    n_layers: 2
    d_ff: 128
    static_hidden: 128
    hidden: [256, 128]
    dropout: 0.1
    lr: 0.001
    batch_size: 4096
    max_epochs: 30
    patience: 4
    device: auto
  resnet_mlp:                      # architecture follow-up (Gorishniy et al. 2021 tabular ResNet)
    d: 256
    d_hidden: 512
    n_blocks: 3
    dropout_hidden: 0.1
    dropout_residual: 0.0
    lr: 0.001
    batch_size: 4096
    max_epochs: 40
    patience: 5
    device: auto
  gru:                             # sequence follow-up (returning lifters)
    seq_len: 8
    gru_hidden: 64
    static_hidden: 128
    hidden: [128, 64]
    dropout: 0.1
    lr: 0.001
    batch_size: 4096
    max_epochs: 30
    patience: 4
    device: auto

# Capacity check (protocol A, feature sets D and D+history), added after the base
# runs and judged on VALIDATION only, before any test scoring. Selection rule fixed
# in advance: a larger variant replaces the base model of its family only if its
# validation MAE is lower by >= min_gain_kg with a lifter-bootstrap paired CI
# excluding 0. All variants are reported either way.
capacity:
  min_gain_kg: 0.2
  variants:
    mlp_wide: {model: mlp, overrides: {hidden: [256, 128]}}
    mlp_deep: {model: mlp, overrides: {hidden: [512, 256, 128]}}
    lgbm_big: {model: lightgbm, overrides: {learning_rate: 0.03, n_estimators: 8000,
                                            fixed_grid: [{num_leaves: 511, min_child_samples: 50}]}}

# Follow-up #6: prediction ranges. LightGBM quantile models (10th and 90th
# percentiles, nominal 80% range) reuse protocol-A-selected tree settings. A
# conformal correction (CQR) is estimated on VALIDATION rows only; coverage is
# then checked on test.
quantile:
  levels: [0.1, 0.9]
  target_coverage: 0.8

# Follow-up: LightGBM objective / target variants for the two best specialists.
# Winner per feature set = lowest validation MAE (kg), base model included.
objective_variants:
  l1_kg: {objective: regression_l1}
  huber_kg: {objective: huber, huber_delta: 10.0}
  l2_ratio: {objective: regression, target: ratio}
  l1_ratio: {objective: regression_l1, target: ratio}

# Follow-up: bounded random hyperparameter search (validation only). Trials train
# on a fixed sample of training lifters; the best setting per target is refit on
# the full training partition ("tuned" runs).
hpo:
  seed: 0
  train_fraction: 0.3
  trials: {lightgbm: 16, embed_mlp: 8, gru: 6}

# Follow-up: extra seeds for the tuned models; predictions are averaged per model.
seedavg:
  extra_seeds: [43, 44]

evaluation:
  bootstrap_reps: 200
  sparse_rows: 100
  sparse_lifters: 30
